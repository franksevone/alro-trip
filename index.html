<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>กำหนดการเดินทาง • สจด.</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-blue-100 pb-16">

  <!-- Mobile Sticky Top Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-sm border-b border-slate-800 backdrop-blur-md bg-slate-900/95">
    <div class="max-w-xl mx-auto px-3 py-2.5 flex items-center justify-between">
      <div class="flex items-center space-x-2 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shrink-0 shadow-xs">
          <i data-lucide="compass" class="w-4 h-4"></i>
        </div>
        <div class="min-w-0">
          <h1 class="text-xs font-bold uppercase tracking-wider text-sky-400 leading-tight">กำหนดการเดินทาง</h1>
          <p class="text-xs font-semibold text-slate-200 truncate leading-tight">สำนักงานจัดรูปที่ดินกลาง (สจด.)</p>
        </div>
      </div>

      <div class="flex items-center space-x-1.5 shrink-0 no-print">
        <a href="map.html" class="px-2.5 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-900 font-bold text-xs flex items-center space-x-1 shadow-xs transition" title="ดูแผนที่การเดินทาง">
          <span class="text-xs">🗺️</span>
          <span>แผนที่การเดินทาง</span>
        </a>
        <button id="btnShare" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 flex items-center justify-center transition" title="แชร์">
          <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
        </button>
        <button id="btnPrint" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 flex items-center justify-center transition" title="พิมพ์">
          <i data-lucide="printer" class="w-3.5 h-3.5"></i>
        </button>
        <a href="admin.html" class="px-2.5 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white text-xs font-semibold flex items-center space-x-1 shadow-xs transition" title="ระบบหลังบ้าน">
          <i data-lucide="settings" class="w-3.5 h-3.5"></i>
          <span class="text-xs">หลังบ้าน</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Mobile App Layout -->
  <main class="max-w-xl mx-auto px-3 py-3 space-y-3">

    <!-- Compact Title strip -->
    <div class="bg-white rounded-xl p-3 shadow-2xs border border-slate-200/90 space-y-2">
      <div class="flex items-start justify-between gap-2">
        <div>
          <span class="inline-flex items-center px-2 py-0.5 rounded text-3xs font-bold uppercase bg-blue-50 text-blue-700 border border-blue-200 mb-1">
            ตรวจราชการ ผส.จด.
          </span>
          <h2 id="eventTitle" class="text-sm font-bold text-slate-900 leading-snug">
            กำหนดการตรวจติดตามผลการดำเนินงานและมอบนโยบาย
          </h2>
          <p id="eventSubtitle" class="text-xs text-slate-500 mt-0.5">
            โดย ผู้อำนวยการสำนักงานจัดรูปที่ดินกลาง (ผส.จด.) และคณะ
          </p>
        </div>
      </div>
    </div>

    <!-- Segmented Day Switcher Bar (Mobile Friendly) -->
    <div class="space-y-1.5 no-print">
      <div id="daysTabsContainer" class="grid grid-cols-2 gap-1.5 bg-slate-200/80 p-1 rounded-xl">
        <!-- Rendered dynamically as compact segmented tabs -->
      </div>
    </div>

    <!-- Active Day Mini Route & Status Bar -->
    <div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white rounded-xl px-3 py-2 shadow-xs flex items-center justify-between gap-2">
      <div class="min-w-0">
        <div class="flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <h3 id="currentDayTitle" class="text-xs sm:text-sm font-bold truncate">วันอังคารที่ 27 ตุลาคม 2569</h3>
        </div>
        <p id="currentDayRoute" class="text-2xs text-sky-200 truncate flex items-center mt-0.5">
          <i data-lucide="navigation" class="w-2.5 h-2.5 mr-1 shrink-0"></i>
          <span class="truncate">เส้นทาง: --</span>
        </p>
      </div>
    </div>

    <!-- Filter chips & Search row -->
    <div class="space-y-2 no-print">
      <!-- Search bar -->
      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-400"></i>
        <input type="text" id="searchInput" placeholder="ค้นหาจุดหมาย, สถานที่, กิจกรรม..." 
          class="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 shadow-2xs">
      </div>

      <!-- Compact Category Scrollable Chips -->
      <div class="flex items-center justify-between gap-1 overflow-x-auto pb-0.5 scrollbar-none" id="categoryFilterContainer">
        <button class="filter-btn active px-2.5 py-1 rounded-lg text-2xs font-semibold bg-blue-600 text-white shrink-0 shadow-2xs" data-category="all">
          ทั้งหมด
        </button>
        <button class="filter-btn px-2.5 py-1 rounded-lg text-2xs font-semibold bg-white text-slate-700 border border-slate-200 shrink-0 hover:bg-slate-50" data-category="meeting">
          🏛️ ประชุม
        </button>
        <button class="filter-btn px-2.5 py-1 rounded-lg text-2xs font-semibold bg-white text-slate-700 border border-slate-200 shrink-0 hover:bg-slate-50" data-category="inspection">
          🌾 ตรวจงาน
        </button>
        <button class="filter-btn px-2.5 py-1 rounded-lg text-2xs font-semibold bg-white text-slate-700 border border-slate-200 shrink-0 hover:bg-slate-50" data-category="meal">
          🍲 อาหาร
        </button>
        <button class="filter-btn px-2.5 py-1 rounded-lg text-2xs font-semibold bg-white text-slate-700 border border-slate-200 shrink-0 hover:bg-slate-50" data-category="sightseeing">
          🙏 สิริมงคล
        </button>
        
        <button id="btnToggleAll" class="text-2xs px-2 py-1 rounded-lg bg-slate-200/80 text-slate-700 font-semibold shrink-0 ml-auto flex items-center space-x-0.5">
          <i data-lucide="chevrons-down" class="w-3 h-3"></i>
          <span id="btnToggleAllText">ขยายทุกจุด</span>
        </button>
      </div>
    </div>

    <!-- Compact Stops Feed -->
    <div id="stopsTimeline" class="space-y-2.5 pt-1">
      <!-- Dynamically injected stops -->
    </div>

  </main>

  <!-- Mobile Floating Quick Help / Footer -->
  <footer class="mt-8 border-t border-slate-200 bg-white py-4 text-center text-2xs text-slate-500 no-print">
    <div class="max-w-xl mx-auto px-4 flex items-center justify-between">
      <div class="flex items-center space-x-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span class="font-medium text-slate-700">สจด. กรมชลประทาน</span>
      </div>
      <div class="flex items-center space-x-3">
        <a href="admin.html" class="text-blue-600 font-semibold hover:underline">จัดการหลังบ้าน</a>
        <span>•</span>
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="text-slate-600 hover:text-blue-600 flex items-center">
          <i data-lucide="arrow-up" class="w-3 h-3 mr-0.5"></i> บนสุด
        </button>
      </div>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-3.5 py-2 rounded-full shadow-lg text-xs font-medium flex items-center space-x-1.5 whitespace-nowrap">
    <i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-400"></i>
    <span id="toastMsg">แจ้งเตือน</span>
  </div>

  <!-- Main JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
